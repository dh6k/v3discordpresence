# Builds the Windows host binary, v3dpsetup.msi, extension CRX/zips, and update manifests.
# Local: node scripts/pack-extension.js   |  npm run compile in NodeHost  |  VS build of Host/v3dpsetup/v3dpsetup.vdproj
name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: NodeHost/package-lock.json

      - name: Build v3dpwin.exe
        working-directory: NodeHost
        run: |
          npm ci
          npm run compile

      - name: Build v3dpsetup.msi
        shell: pwsh
        run: .github/scripts/build-msi.ps1

      - name: Package extensions (CRX + update manifests)
        shell: pwsh
        env:
          CRX_KEY_BASE64: ${{ secrets.CRX_KEY_BASE64 }}
        run: .github/scripts/package-extensions.ps1

      - name: Collect artifacts
        shell: pwsh
        run: |
          Copy-Item Host/v3dpsetup/Release/v3dpsetup.msi dist/
          Copy-Item updates.xml dist/
          # drop stage dirs + unpacked trees from the release payload
          Get-ChildItem dist -Directory | Remove-Item -Recurse -Force
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: v3dp-dist
          path: dist/*
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.crx
            dist/*.zip
            dist/*.msi
            dist/*.xml
            dist/*.json
            dist/extension-id.txt
          generate_release_notes: true
